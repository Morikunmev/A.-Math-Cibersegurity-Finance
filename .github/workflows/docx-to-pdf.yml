name: Convertir DOCX a PDF

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Necesario para ver cambios
      
      - name: Verificar si hay archivos DOCX
        id: check_docx
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '\.docx$'; then
            echo "has_docx=true" >> $GITHUB_OUTPUT
            echo "✅ Se detectaron archivos .docx"
          else
            echo "has_docx=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No hay archivos .docx para convertir"
          fi
      
      - name: Instalar LibreOffice
        if: steps.check_docx.outputs.has_docx == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice
      
      - name: Convertir DOCX a PDF
        if: steps.check_docx.outputs.has_docx == 'true'
        run: |
          # Obtener archivos .docx del último commit
          git diff --name-only HEAD~1 HEAD | grep '\.docx$' | while read docx_file; do
            if [ -f "$docx_file" ]; then
              dir=$(dirname "$docx_file")
              filename=$(basename "$docx_file" .docx)
              
              echo "🔄 Convirtiendo: $docx_file"
              libreoffice --headless --convert-to pdf --outdir "$dir" "$docx_file"
              
              # Eliminar el .docx
              git rm -f "$docx_file"
              echo "✅ Convertido: $filename.pdf"
              echo "🗑️  Eliminado: $docx_file"
            fi
          done
      
      - name: Commit y push de PDFs
        if: steps.check_docx.outputs.has_docx == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          git add "**/*.pdf"
          
          if git diff --staged --quiet; then
            echo "ℹ️ No hay cambios para commitear"
          else
            git commit -m "📄 Auto-conversión: DOCX → PDF [skip ci]"
            git push
            echo "✅ PDFs pusheados exitosamente"
          fi
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizador de Coordenadas Polares</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%); }
    .formula-box {
      background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
      border-left: 5px solid #0ea5e9;
    }
  </style>
</head>
<body class="min-h-screen p-6">
  <div class="max-w-7xl mx-auto">
    
    <div class="text-center mb-8">
      <h1 class="text-5xl font-black text-sky-900 mb-2 drop-shadow-lg">
        🌀 SISTEMA DE COORDENADAS 🌀
      </h1>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      
      <div class="bg-white rounded-2xl shadow-2xl p-6 border-4 border-sky-300">
        <h2 class="text-2xl font-black text-center mb-4 text-sky-900">📍 PLANO POLAR</h2>
        <div class="flex justify-center mb-4">
          <svg id="polarCanvas" width="380" height="380" viewBox="-200 -200 400 400" class="bg-slate-50 rounded-xl border-2 border-slate-300">
            <circle cx="0" cy="0" r="50" fill="none" stroke="#e2e8f0" stroke-width="1" />
            <circle cx="0" cy="0" r="100" fill="none" stroke="#e2e8f0" stroke-width="1" />
            <circle cx="0" cy="0" r="150" fill="none" stroke="#e2e8f0" stroke-width="1" />
            <line x1="-180" y1="0" x2="180" y2="0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4"/>
            <line x1="0" y1="-180" x2="0" y2="180" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4"/>
            <line id="vectorLine" x1="0" y1="0" x2="0" y2="0" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round"/>
            <circle id="polarPoint" cx="0" cy="0" r="6" fill="#ef4444" stroke="white" stroke-width="2"/>
          </svg>
        </div>

        <div class="space-y-4">
          <div class="bg-sky-50 rounded-xl p-4 border-2 border-sky-200">
            <label class="block text-sm font-black text-sky-900 mb-1 text-center">📏 RADIO (r): <span id="valR">100</span></label>
            <input type="range" id="sliderR" min="10" max="180" value="100" class="w-full h-3 bg-sky-200 rounded-lg cursor-pointer accent-sky-600">
          </div>
          <div class="bg-amber-50 rounded-xl p-4 border-2 border-amber-200">
            <label class="block text-sm font-black text-amber-900 mb-1 text-center">📐 ÁNGULO (θ): <span id="valTheta">45°</span></label>
            <input type="range" id="sliderTheta" min="0" max="360" value="45" class="w-full h-3 bg-amber-200 rounded-lg cursor-pointer accent-amber-600">
          </div>
        </div>
      </div>

      <div class="space-y-4">
        
        <div class="bg-white rounded-2xl shadow-xl p-5 border-4 border-blue-400">
          <h2 class="text-xl font-black mb-3 text-blue-900 text-center">🔄 DE POLAR A CARTESIANA</h2>
          <div class="space-y-2">
            <div class="formula-box p-3 rounded-lg">
              <p class="text-xs font-bold text-slate-500 uppercase">Coordenada X</p>
              <p id="resX" class="text-lg font-black text-slate-700"></p>
            </div>
            <div class="formula-box p-3 rounded-lg">
              <p class="text-xs font-bold text-slate-500 uppercase">Coordenada Y</p>
              <p id="resY" class="text-lg font-black text-slate-700"></p>
            </div>
          </div>
        </div>

        <div class="bg-white rounded-2xl shadow-xl p-5 border-4 border-purple-400">
          <h2 class="text-xl font-black mb-3 text-purple-900 text-center">🔄 DE CARTESIANA A POLAR</h2>
          <div class="space-y-2">
            <div class="formula-box p-3 rounded-lg border-purple-500" style="border-left-color: #a855f7;">
              <p class="text-xs font-bold text-slate-500 uppercase">Radio (r)</p>
              <p id="calcR" class="text-lg font-black text-slate-700"></p>
            </div>
            <div class="formula-box p-3 rounded-lg border-purple-500" style="border-left-color: #a855f7;">
              <p class="text-xs font-bold text-slate-500 uppercase">Ángulo (θ)</p>
              <p id="calcTheta" class="text-lg font-black text-slate-700"></p>
            </div>
          </div>
        </div>

        <div class="bg-slate-900 rounded-2xl p-5 text-white border-4 border-slate-700">
          <div class="grid grid-cols-2 text-center gap-4">
            <div>
              <p class="text-xs text-sky-400 font-bold">POLAR (r, θ)</p>
              <p id="notePolar" class="text-lg font-mono font-bold text-amber-400"></p>
            </div>
            <div>
              <p class="text-xs text-sky-400 font-bold">RECTANGULAR (x, y)</p>
              <p id="noteCart" class="text-lg font-mono font-bold text-green-400"></p>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    const sR = document.getElementById('sliderR');
    const sT = document.getElementById('sliderTheta');

    function update() {
      const r = parseFloat(sR.value);
      const tDeg = parseFloat(sT.value);
      const tRad = tDeg * (Math.PI / 180);

      // 1. Polar a Cartesiana
      const x = r * Math.cos(tRad);
      const y = r * Math.sin(tRad);

      // 2. Cartesiana a Polar (Demostración)
      const rCalc = Math.sqrt(x*x + y*y);
      const tCalc = Math.atan2(y, x) * (180 / Math.PI);
      const tFinal = tCalc < 0 ? tCalc + 360 : tCalc; // Ajuste 360°

      // UI
      document.getElementById('valR').innerText = r;
      document.getElementById('valTheta').innerText = tDeg + "°";

      document.getElementById('resX').innerHTML = `x = ${x.toFixed(2)} <span class="text-xs text-slate-400">(${r} · cos(${tDeg}°))</span>`;
      document.getElementById('resY').innerHTML = `y = ${y.toFixed(2)} <span class="text-xs text-slate-400">(${r} · sin(${tDeg}°))</span>`;
      
      document.getElementById('calcR').innerHTML = `r = ${rCalc.toFixed(0)} <span class="text-xs text-slate-400">(√(${x.toFixed(1)}² + ${y.toFixed(1)}²))</span>`;
      document.getElementById('calcTheta').innerHTML = `θ = ${tFinal.toFixed(0)}° <span class="text-xs text-slate-400">(atan(${y.toFixed(1)} / ${x.toFixed(1)}))</span>`;

      document.getElementById('notePolar').innerText = `(${r}, ${tDeg}°)`;
      document.getElementById('noteCart').innerText = `(${x.toFixed(2)}, ${y.toFixed(2)})`;

      document.getElementById('polarPoint').setAttribute('cx', x);
      document.getElementById('polarPoint').setAttribute('cy', -y);
      document.getElementById('vectorLine').setAttribute('x2', x);
      document.getElementById('vectorLine').setAttribute('y2', -y);
    }

    sR.addEventListener('input', update);
    sT.addEventListener('input', update);
    update();
  </script>
</body>
</html>
